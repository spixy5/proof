name: Release

# Push a tag like v1.0.0 and this builds a signed release APK and publishes it on GitHub Releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.PROOF_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # Optional: add these repository secrets to sign with your own key.
      # Without them the APK is signed with a throwaway debug key, which is fine for sideloading demos.
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.PROOF_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/proof.jks"

      - name: Build release APK
        env:
          PROOF_KEYSTORE_PATH: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/proof.jks', runner.temp) || '' }}
          PROOF_KEYSTORE_PASSWORD: ${{ secrets.PROOF_KEYSTORE_PASSWORD }}
          PROOF_KEY_ALIAS: ${{ secrets.PROOF_KEY_ALIAS }}
          PROOF_KEY_PASSWORD: ${{ secrets.PROOF_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.PROOF_API_BASE_URL }}
        run: |
          ARGS=""
          if [ -n "$API_BASE_URL" ]; then ARGS="-PapiBaseUrl=$API_BASE_URL"; fi
          ./gradlew assembleRelease $ARGS
          cp app/build/outputs/apk/release/app-release.apk "proof-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/proof-${{ github.ref_name }}.apk
          generate_release_notes: true
